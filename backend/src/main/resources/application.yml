server:
  port: 8080

spring:
  application:
    name: bili-agent-backend
  datasource:
    url: ${APP_DB_URL:jdbc:mysql://127.0.0.1:3306/bili_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${APP_DB_USERNAME:root}
    password: ${APP_DB_PASSWORD:root}
  flyway:
    enabled: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379

app:
  jwt:
    secret: ${APP_JWT_SECRET:bili-agent-demo-secret-key-bili-agent-demo}
  ai:
    openai:
      base-url: ${APP_AI_OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${APP_AI_OPENAI_API_KEY:}
      model: ${APP_AI_OPENAI_MODEL:deepseek-chat}
